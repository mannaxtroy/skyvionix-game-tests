<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Skyvionix Arena</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #090D16; overflow: hidden; }
        #canvas { width: 100%; height: 100%; object-fit: contain; }
        #skyvionix-splash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #090D16; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 9999;
            color: #00E5FF; font-family: sans-serif; transition: opacity 0.5s ease;
        }
    </style>
</head>
<body>
    <div id="skyvionix-splash">
        <h1 style="font-size: 3rem; font-weight: 900; letter-spacing: 4px; margin: 0; text-shadow: 0 0 20px rgba(0, 229, 255, 0.5);">SKYVIONIX</h1>
        <div style="margin-top: 20px; font-size: 1.2rem; color: #ffffff; opacity: 0.7;">Loading Arena...</div>
    </div>
    <canvas id="canvas"></canvas>
    {{DEFOLD_BINDINGS}}
    <script>
        window.addEventListener('load', function() {
            setTimeout(function() {
                var splash = document.getElementById('skyvionix-splash');
                if (splash) splash.style.opacity = '0';
                setTimeout(function() { if (splash) splash.style.display = 'none'; }, 500);
            }, 1500);
        });
    </script>
</body>
</html>
