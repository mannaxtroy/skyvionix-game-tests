name: Build Starbreaker (Defold) to Web

on:
  push:
    branches: [ main ]

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Defold Web
        uses: prismglue/defold-builder-simple@1.1.0
        with:
          project_title: "Starbreaker"
          defold_version: "1.9.2"

      - name: Upload Finished Build
        uses: actions/upload-artifact@v4
        with:
          name: starbreaker-web-build
          path: build/default/
