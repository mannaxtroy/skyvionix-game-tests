name: Build Starbreaker (Defold) to Web

on:
  push:
    branches: [ main ]

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Defold Web
        uses: koenbollen/defold-action@main
        with:
          target-platform: 'web'

      - name: Upload Finished Build
        uses: actions/upload-artifact@v4
        with:
          name: starbreaker-web-build
          path: build/default/
