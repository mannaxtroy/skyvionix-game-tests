name: Build Starbreaker (Defold) to Web

on:
  push:
    branches: [ main ]

jobs:
  build-web:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/defold/defold:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Dependencies
        run: |
          bob resolve

      - name: Build HTML5/WASM
        run: |
          bob --archive --platform js-web --variant debug build

      - name: Upload Finished Build
        uses: actions/upload-artifact@v4
        with:
          name: starbreaker-web-build
          path: build/default/
